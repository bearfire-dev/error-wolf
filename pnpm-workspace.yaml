# This repo is not a workspace. The file exists only to hold pnpm settings.
#
# `allowBuilds` and `minimumReleaseAgeExclude` are pnpm 11 keys, and pnpm 10
# rejects a workspace file that has no `packages` field. `package.json` pins
# `packageManager` to pnpm 11 so every environment agrees, including the
# Cloudflare build image, which defaults to pnpm 10.
#
# Postinstall scripts pnpm is allowed to run. Without these, `pnpm <script>`
# aborts on its dependency-status check. esbuild backs Vitest, workerd backs
# Wrangler local checks, sharp backs vite-imagetools, and the Sentry CLI
# downloads the binary that uploads source maps.
overrides:
  "@effect/platform-node-shared": 4.0.0-beta.100

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260730.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260730.1"
  - "@cloudflare/workerd-linux-64@1.20260730.1"
  - "@cloudflare/workerd-linux-arm64@1.20260730.1"
  - "@cloudflare/workerd-windows-64@1.20260730.1"
  - "@tanstack/react-start-rsc@0.1.33"
  - "@tanstack/react-start@1.168.34"
  - "@tanstack/start-plugin-core@1.171.25"
  - miniflare@4.20260730.0
  - vite@8.2.0
  - workerd@1.20260730.1
  - wrangler@4.116.0
  - effect@4.0.0-beta.100
  - "@effect/platform-node@4.0.0-beta.100"
