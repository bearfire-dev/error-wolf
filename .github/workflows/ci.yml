# Deploy needs the repo secret CLOUDFLARE_API_TOKEN with the Workers Scripts:Edit
# permission. Without it the job still runs lint, typecheck, test, and build, and
# the deploy step reports that it was skipped.
#
# Source map upload needs the repo secret POSTHOG_CLI_API_KEY (a phx_ personal
# API key) and the repo variable POSTHOG_CLI_ENV_ID. Same rule: absent means
# skipped, not failed.
#
# The PostHog reverse proxy is a second Worker under workers/posthog-proxy. It
# changes rarely, so it is not deployed here. Run `pnpm run deploy:proxy` by
# hand after you edit it.

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: error-wolf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run lint

      # Writes worker-configuration.d.ts, which declares `cloudflare:workers`.
      # The file is generated from wrangler.jsonc plus the local .env, so it is
      # gitignored and rebuilt here rather than committed.
      - run: pnpm run cf-typegen

      - run: pnpm run typecheck
      - run: pnpm run test

      # POSTHOG_CLI_* are CI-only. When they are absent, vite.config.ts turns
      # source maps off and the build still succeeds.
      - name: Build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_ENV_ID: ${{ vars.POSTHOG_CLI_ENV_ID }}
        run: pnpm run build

      # Injects a chunk id into each bundle, then uploads the maps so PostHog
      # can symbolicate browser stack traces. Skipped without the credentials.
      - name: Upload source maps
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_ENV_ID: ${{ vars.POSTHOG_CLI_ENV_ID }}
        run: |
          if [ -n "$POSTHOG_CLI_API_KEY" ] && [ -n "$POSTHOG_CLI_ENV_ID" ]; then
            pnpm run sourcemaps:upload --release-version "$GITHUB_SHA"
          else
            echo "No POSTHOG_CLI_API_KEY / POSTHOG_CLI_ENV_ID: skipping source map upload."
          fi

      # Prints "Total Upload: ... / gzip: ...". Cloudflare rejects a Worker
      # above 3 MiB gzip.
      - name: Report Worker bundle size
        run: pnpm exec wrangler deploy --dry-run

      - name: Deploy Worker
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            pnpm dlx wrangler@4.116.0 deploy
          else
            echo "No CLOUDFLARE_API_TOKEN: skipping wrangler. Set the repo secret to deploy from CI."
          fi
